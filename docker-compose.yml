services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306" # Avoid Windows MySQL80 (3306)
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
      MYSQL_DATABASE: edumaster_db
      MYSQL_USER: edumaster
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - edumaster_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://edumaster:${DB_PASSWORD:?Set DB_PASSWORD}@db:3306/edumaster_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to 64 random hex characters}
      PORT: 5000
      CLIENT_URL: http://localhost:8080
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "8080:80"
volumes:
  edumaster_mysql_data:
